# Configuration Cloudflare : un Worker qui sert le jeu (fichiers statiques) et l'API /api/*.
name = "ukipu"
main = "server/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ukipu"
# Base D1 « ukipu » du compte Cloudflare
database_id = "98d26ab7-8dcc-4233-96b5-349922ed5d47"

# Journaux du Worker visibles dans le tableau de bord (Workers & Pages → ukipu → Observabilité)
[observability]
enabled = true

# Toutes les heures (à la 17e minute) : rappels par notification (caisses pleines, chantiers, cadeau du jour)
[triggers]
crons = ["17 * * * *"]
